[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = [
    "-C", "link-arg=-Wl,-L/run/host/usr/lib64",
    "-C", "link-arg=-Wl,-L/usr/lib/x86_64-linux-gnu",
    "-C", "link-arg=-Wl,-L/lib/x86_64-linux-gnu",
    "-C", "link-arg=-Wl,--library-path=/run/host/usr/lib64",
    "-C", "link-arg=-Wl,--library-path=/usr/lib/x86_64-linux-gnu",
    "-C", "link-arg=-Wl,--library-path=/lib/x86_64-linux-gnu",
]