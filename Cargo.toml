[package]
name = "spotty"
version = "0.6.0"
edition = "2021"
[[bin]]
name = "spotty"
path = "src/main.rs"
[dependencies]
libc = "0.2"
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk = { version = "0.9", package = "gdk4" }
gdk-pixbuf = "0.20"
futures = "0.3"
futures-channel = "0.3"
nucleo-matcher = "0.3"
ignore = "0.4"
urlencoding = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
infer = "0.16"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1.1.9"
cairo-rs = { version = "0.20", features = ["png"] }
cfb = "0.7"
image = { version = "0.25", features = ["avif-native"] }
resvg = "0.44"
tiny-skia = "0.11"
ytmusic-api = "0.2.0"
rodio = "0.22.2"
metaflac = "0.2.8"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "mp3", "pcm", "vorbis", "isomp4", "ogg", "wav"] }
libheif-rs = { version = "2.7.0", features = ["embedded-libheif"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
