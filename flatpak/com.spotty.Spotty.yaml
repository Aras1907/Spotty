# Flatpak manifest for Spotty.
#
# Design notes:
#   • Spotty runs sandboxed; it does NOT call host binaries via flatpak-spawn.
#   • The preview helper tools (poppler/pdftoppm, ffmpeg/ffmpegthumbnailer) are
#     BUNDLED into /app/bin, which Spotty's resolve_tool() checks first.
#   • Office previews need NO external tool — Spotty extracts the preview image
#     embedded inside .pptx/.docx/.xlsx/ODF files directly (pure-Rust zip read).
#   • The shared thumbnail cache (~/.cache/thumbnails) is granted so previews
#     interoperate with the host file manager.
#
# Build: flatpak-builder --user --install --force-clean build-dir flatpak/com.spotty.Spotty.yaml

app-id: com.spotty.Spotty
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: spotty

finish-args:
  - --socket=wayland
  # X11 too, not only as a fallback: Mutter mirrors the clipboard to XWayland,
  # the only place the clipboard history can watch it without focus.
  - --socket=x11
  - --device=dri
  - --filesystem=home
  # The trigger catalog, currency rates, translation and icon downloads.
  - --share=network
  - --filesystem=xdg-cache/thumbnails:create
  - --filesystem=/usr/share/applications:ro
  - --filesystem=/usr/local/share/applications:ro
  - --filesystem=/var/lib/flatpak/exports/share/applications:ro
  # Flathub's AppStream catalog for "install …": read in place instead of
  # running `flatpak remote-ls`, which needs ~450 MB per call.
  - --filesystem=/var/lib/flatpak/appstream:ro
  - --filesystem=/var/lib/snapd/desktop/applications:ro
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.Shell.Extensions
  - --talk-name=org.freedesktop.Notifications
  # Distro updates go through the host's dnf5daemon (the service the Software
  # store uses), which is passwordless for a wheel user — that is the whole
  # reason to prefer it over `pkexec dnf` on the host.
  - --system-talk-name=org.rpm.dnf.v0
  # Installs and updates on every other distro (apt, zypper, pacman, …) go
  # through PackageKit, the same service GNOME Software drives: polkit decides,
  # so no `pkexec` and no host escape is needed to change packages.
  - --system-talk-name=org.freedesktop.PackageKit
  - --own-name=com.spotty.Spotty

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  # ---- Bundled preview tools -------------------------------------------
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_UTILS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.02.0.tar.xz
        sha256: 19187a3fdd05f33e7d604c4799c183de5ca0118640c88b370ddcf3136343222e

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --disable-programs
      - --enable-ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.0.tar.xz
        sha256: 4426a94dd2c814945456600c8adfc402bee65ec14a70e8c531ec9a2cd651da7b

  # ---- Tesseract OCR engine --------------------------------------------
  - name: leptonica
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      # OCR dlopens libtesseract.so.5.5: without these it was built as a
      # static lib in /app/lib64, so OCR was off in the Flatpak.
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DOPENMP_BUILD=OFF
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DENABLE_OPENCL=OFF
      - -DBUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11

  - name: tessdata-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  # ---- AV1 decoder for AVIF images -------------------------------------
  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/dav1d/-/archive/1.5.0/dav1d-1.5.0.tar.gz
        sha256: 78b15d9954b513ea92d27f39362535ded2243e1b0924fde39f37a31ebed5f76b

  # ---- Spotty itself ----------------------------------------------------
  - name: spotty
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # The SDK's AOM CMake config names a libaom.a it does not ship, which
      # breaks the embedded libheif build; AVIF decoding goes through dav1d.
      - printf 'set(CMAKE_DISABLE_FIND_PACKAGE_AOM ON)\n' > no-aom.cmake
      - CMAKE_TOOLCHAIN_FILE="$PWD/no-aom.cmake" cargo build --release
      - install -Dm755 target/release/spotty /app/bin/spotty
      - install -Dm644 data/applications/com.spotty.Spotty.desktop /app/share/applications/com.spotty.Spotty.desktop
      - install -Dm644 data/metainfo/com.spotty.Spotty.metainfo.xml /app/share/metainfo/com.spotty.Spotty.metainfo.xml
      - install -Dm644 data/icons/hicolor/512x512/apps/com.spotty.Spotty.png /app/share/icons/hicolor/512x512/apps/com.spotty.Spotty.png
      - install -Dm644 data/icons/hicolor/scalable/actions/spotty-store-symbolic.svg /app/share/icons/hicolor/scalable/actions/spotty-store-symbolic.svg
      - |
        for po in po/*.po; do
          lang=$(basename "$po" .po)
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt --check -o "/app/share/locale/$lang/LC_MESSAGES/spotty.mo" "$po"
        done
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build
          - .flatpak-builder
          - build-dir
          - .git
          - trigger-backends/build
          - trigger-backends/.git
